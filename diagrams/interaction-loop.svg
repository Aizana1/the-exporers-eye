<svg viewBox="0 0 680 700" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Interaction loop for exploring a single object</title>
  <desc>Visitor answers a question: a correct answer adds score; a wrong answer allows a second attempt, and after two wrong attempts the correct answer plus study info is revealed. Both paths converge on the reveal, then the next question, then back to the region.</desc>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&amp;family=EB+Garamond:wght@400;500&amp;display=swap');
    text { font-family: "EB Garamond", Georgia, serif; }
    .dg-h { font-family: "Cinzel", Georgia, serif; font-weight: 700; font-size: 14px; letter-spacing: 0.02em; }
    .dg-s { font-size: 12px; }
    .dg-arr { stroke: #5f7d96; stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5f7d96" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Open object (neutral) -->
  <rect x="250" y="30" width="180" height="56" rx="8" fill="#1b2436" stroke="#94a3b8" stroke-width="1"/>
  <text class="dg-h" x="340" y="50" text-anchor="middle" dominant-baseline="central" fill="#cbd5e1">Visitor opens object</text>
  <text class="dg-s" x="340" y="68" text-anchor="middle" dominant-baseline="central" fill="#94a3b8">Taps card on phone</text>
  <line x1="340" y1="86" x2="340" y2="116" class="dg-arr" marker-end="url(#arrow)"/>

  <!-- Question (coral) -->
  <rect x="250" y="116" width="180" height="56" rx="8" fill="#2a1217" stroke="#fb7185" stroke-width="1"/>
  <text class="dg-h" x="340" y="136" text-anchor="middle" dominant-baseline="central" fill="#fb7185">Question shown</text>
  <text class="dg-s" x="340" y="154" text-anchor="middle" dominant-baseline="central" fill="#fda4af">Image and 4 options</text>
  <line x1="340" y1="172" x2="340" y2="202" class="dg-arr" marker-end="url(#arrow)"/>

  <!-- Answer (blue) -->
  <rect x="250" y="202" width="180" height="56" rx="8" fill="#0c2333" stroke="#38bdf8" stroke-width="1"/>
  <text class="dg-h" x="340" y="222" text-anchor="middle" dominant-baseline="central" fill="#7dd3fc">Visitor answers</text>
  <text class="dg-s" x="340" y="240" text-anchor="middle" dominant-baseline="central" fill="#38bdf8">Picks one option</text>

  <!-- Correct path (left) -->
  <text class="dg-s" x="170" y="216" text-anchor="middle" fill="#8ba4b8">Correct</text>
  <path d="M250 230 L100 230 L100 470 L248 470" class="dg-arr" marker-end="url(#arrow)"/>

  <!-- Wrong path (right) -->
  <text class="dg-s" x="465" y="216" text-anchor="middle" fill="#8ba4b8">Wrong</text>
  <line x1="430" y1="230" x2="500" y2="230" class="dg-arr" marker-end="url(#arrow)"/>
  <rect x="500" y="202" width="160" height="56" rx="8" fill="#241708" stroke="#f97316" stroke-width="1"/>
  <text class="dg-h" x="580" y="222" text-anchor="middle" dominant-baseline="central" fill="#f8b272">Wrong attempt</text>
  <text class="dg-s" x="580" y="240" text-anchor="middle" dominant-baseline="central" fill="#f97316">Try again</text>

  <!-- retry loop back to question -->
  <text class="dg-s" x="455" y="284" text-anchor="middle" fill="#8ba4b8">1st wrong: retry</text>
  <path d="M580 258 L580 300 L340 300 L340 262" class="dg-arr" marker-end="url(#arrow)"/>

  <!-- 2nd wrong down to reveal -->
  <text class="dg-s" x="635" y="330" text-anchor="end" fill="#8ba4b8">2nd wrong</text>
  <line x1="580" y1="258" x2="580" y2="360" class="dg-arr" marker-end="url(#arrow)"/>

  <!-- Score added (green) -->
  <rect x="250" y="442" width="180" height="56" rx="8" fill="#13260f" stroke="#4ade80" stroke-width="1"/>
  <text class="dg-h" x="340" y="462" text-anchor="middle" dominant-baseline="central" fill="#86efac">Score added</text>
  <text class="dg-s" x="340" y="480" text-anchor="middle" dominant-baseline="central" fill="#4ade80">Correct first</text>
  <line x1="340" y1="498" x2="340" y2="528" class="dg-arr" marker-end="url(#arrow)"/>

  <!-- Reveal answer (teal) -->
  <rect x="500" y="360" width="160" height="56" rx="8" fill="#0e2b27" stroke="#2dd4bf" stroke-width="1"/>
  <text class="dg-h" x="580" y="380" text-anchor="middle" dominant-baseline="central" fill="#5fe6d2">Reveal answer</text>
  <text class="dg-s" x="580" y="398" text-anchor="middle" dominant-baseline="central" fill="#2dd4bf">No score</text>
  <path d="M580 416 L580 556 L432 556" class="dg-arr" marker-end="url(#arrow)"/>

  <!-- Study info (teal) -->
  <rect x="250" y="528" width="180" height="56" rx="8" fill="#0e2b27" stroke="#2dd4bf" stroke-width="1"/>
  <text class="dg-h" x="340" y="548" text-anchor="middle" dominant-baseline="central" fill="#5fe6d2">Study info shown</text>
  <text class="dg-s" x="340" y="566" text-anchor="middle" dominant-baseline="central" fill="#2dd4bf">Extra learning</text>
  <line x1="340" y1="584" x2="340" y2="614" class="dg-arr" marker-end="url(#arrow)"/>

  <!-- Next step (purple) -->
  <rect x="250" y="614" width="180" height="56" rx="8" fill="#1b1833" stroke="#a78bfa" stroke-width="1"/>
  <text class="dg-h" x="340" y="634" text-anchor="middle" dominant-baseline="central" fill="#c4b5fd">Next step</text>
  <text class="dg-s" x="340" y="652" text-anchor="middle" dominant-baseline="central" fill="#a78bfa">Q2, then region</text>
  <path d="M250 642 L40 642 L40 116 L248 116" class="dg-arr" marker-end="url(#arrow)"/>
  <text class="dg-s" x="40" y="390" text-anchor="middle" fill="#8ba4b8">Question 2</text>
</svg>
