<svg viewBox="0 0 680 620" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Map of the virtual museum with four regions and eight objects</title>
  <desc>An entry hub connects freely to four regions — Americas, China, Egypt, Africa — each holding two objects, all leading to a final score screen.</desc>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&amp;family=EB+Garamond:wght@400;500&amp;display=swap');
    text { font-family: "EB Garamond", Georgia, serif; }
    .dg-h { font-family: "Cinzel", Georgia, serif; font-weight: 700; font-size: 14px; letter-spacing: 0.02em; }
    .dg-s { font-size: 12px; }
    .dg-arr { stroke: #5f7d96; stroke-width: 1.5; fill: none; }
    .dg-leader { stroke: #3b5168; stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5f7d96" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Entry hub (neutral) -->
  <rect x="270" y="30" width="140" height="48" rx="8" fill="#1b2436" stroke="#94a3b8" stroke-width="1"/>
  <text class="dg-h" x="340" y="48" text-anchor="middle" dominant-baseline="central" fill="#cbd5e1">Entry hub</text>
  <text class="dg-s" x="340" y="64" text-anchor="middle" dominant-baseline="central" fill="#94a3b8">Pick any region</text>

  <line x1="300" y1="78" x2="130" y2="120" class="dg-arr" marker-end="url(#arrow)"/>
  <line x1="325" y1="78" x2="295" y2="120" class="dg-arr" marker-end="url(#arrow)"/>
  <line x1="355" y1="78" x2="385" y2="120" class="dg-arr" marker-end="url(#arrow)"/>
  <line x1="380" y1="78" x2="550" y2="120" class="dg-arr" marker-end="url(#arrow)"/>
  <line x1="340" y1="78" x2="340" y2="296" class="dg-leader"/>

  <!-- Americas (cyan) -->
  <rect x="40" y="120" width="180" height="40" rx="8" fill="#0e2433" stroke="#22d3ee" stroke-width="1"/>
  <text class="dg-h" x="130" y="140" text-anchor="middle" dominant-baseline="central" fill="#22d3ee">Americas</text>
  <rect x="40" y="172" width="180" height="40" rx="8" fill="#11314a" stroke="#22d3ee" stroke-width="1"/>
  <text class="dg-s" x="130" y="192" text-anchor="middle" dominant-baseline="central" fill="#bfeef7">Potlatch Mask</text>
  <rect x="40" y="220" width="180" height="40" rx="8" fill="#11314a" stroke="#22d3ee" stroke-width="1"/>
  <text class="dg-s" x="130" y="240" text-anchor="middle" dominant-baseline="central" fill="#bfeef7">La Muerte Enramada</text>

  <!-- China (orange) -->
  <rect x="250" y="120" width="180" height="40" rx="8" fill="#241708" stroke="#f97316" stroke-width="1"/>
  <text class="dg-h" x="340" y="140" text-anchor="middle" dominant-baseline="central" fill="#f8b272">China</text>
  <rect x="250" y="172" width="180" height="40" rx="8" fill="#33230f" stroke="#f97316" stroke-width="1"/>
  <text class="dg-s" x="340" y="192" text-anchor="middle" dominant-baseline="central" fill="#f9cfa0">Dragon Tiles</text>
  <rect x="250" y="220" width="180" height="40" rx="8" fill="#33230f" stroke="#f97316" stroke-width="1"/>
  <text class="dg-s" x="340" y="240" text-anchor="middle" dominant-baseline="central" fill="#f9cfa0">Cloisonné Jar</text>

  <!-- Egypt (teal) -->
  <rect x="460" y="120" width="180" height="40" rx="8" fill="#0e2b27" stroke="#2dd4bf" stroke-width="1"/>
  <text class="dg-h" x="550" y="140" text-anchor="middle" dominant-baseline="central" fill="#5fe6d2">Egypt</text>
  <rect x="460" y="172" width="180" height="40" rx="8" fill="#103a34" stroke="#2dd4bf" stroke-width="1"/>
  <text class="dg-s" x="550" y="192" text-anchor="middle" dominant-baseline="central" fill="#b7f0e6">The Younger Memnon</text>
  <rect x="460" y="220" width="180" height="40" rx="8" fill="#103a34" stroke="#2dd4bf" stroke-width="1"/>
  <text class="dg-s" x="550" y="240" text-anchor="middle" dominant-baseline="central" fill="#b7f0e6">The Rosetta Stone</text>

  <!-- Africa (purple) -->
  <rect x="250" y="300" width="180" height="40" rx="8" fill="#1b1833" stroke="#a78bfa" stroke-width="1"/>
  <text class="dg-h" x="340" y="320" text-anchor="middle" dominant-baseline="central" fill="#c4b5fd">Africa</text>
  <rect x="250" y="352" width="180" height="40" rx="8" fill="#272250" stroke="#a78bfa" stroke-width="1"/>
  <text class="dg-s" x="340" y="372" text-anchor="middle" dominant-baseline="central" fill="#d8cffb">Ife Crowned Head</text>
  <rect x="250" y="400" width="180" height="40" rx="8" fill="#272250" stroke="#a78bfa" stroke-width="1"/>
  <text class="dg-s" x="340" y="420" text-anchor="middle" dominant-baseline="central" fill="#d8cffb">African Mask</text>

  <!-- converge to final -->
  <line x1="130" y1="260" x2="300" y2="520" class="dg-arr" marker-end="url(#arrow)"/>
  <line x1="340" y1="440" x2="340" y2="520" class="dg-arr" marker-end="url(#arrow)"/>
  <line x1="550" y1="260" x2="380" y2="520" class="dg-arr" marker-end="url(#arrow)"/>

  <!-- Final (green) -->
  <rect x="250" y="522" width="180" height="56" rx="8" fill="#13260f" stroke="#4ade80" stroke-width="1"/>
  <text class="dg-h" x="340" y="542" text-anchor="middle" dominant-baseline="central" fill="#86efac">Final screen</text>
  <text class="dg-s" x="340" y="560" text-anchor="middle" dominant-baseline="central" fill="#4ade80">Total score</text>
</svg>
